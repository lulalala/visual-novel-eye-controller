[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eyeokuri"
dynamic = ["version"]
description = "Advance visual novels with eye gestures (webcam prototype)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.26",
    # Used on macOS/Linux for key output.
    # Windows key output uses SendInput directly via ctypes.
    "pynput>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
eyeokuri = "eyeokuri.app:main"
eyeokuri-gui = "eyeokuri.gui:main"

[tool.setuptools.dynamic]
version = {attr = "eyeokuri.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eyeokuri = ["icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
