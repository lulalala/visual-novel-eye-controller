# Copy to config.toml and pass with `vn-eye --config config.toml`.
# Every key is optional; the values below are the defaults.

[camera]
index = 0
width = 640
height = 480
fps = 30

[backend]
name = "mediapipe"
# "auto" (GPU on macOS, CPU elsewhere), "cpu" or "gpu"
delegate = "auto"

[eyes]
# "ear" (eye aspect ratio from landmarks) or "blendshape" (MediaPipe eyeBlink scores)
metric = "ear"
# Openness is compared with a rolling median of your open-eye value.
baseline_window_s = 10.0
warmup_s = 2.0
# Closed below baseline * close_ratio, open again above baseline * open_ratio.
close_ratio = 0.55
open_ratio = 0.75
require_both_eyes = true

[long_blink]
enabled = true
# 0.15 lets natural blinks advance; 0.35-0.45 requires a deliberate closure
min_duration_s = 0.15
max_duration_s = 2.0
# "reopen": fire when you open your eyes (hold past max_duration_s to cancel)
# "hold":   fire as soon as min_duration_s is reached
fire_on = "reopen"
# Ignore blinks while the head is turned further than this
max_head_yaw_deg = 12.0
action = "next"

[head]
# Head turns are measured relative to a rolling median of your usual pose
baseline_window_s = 10.0

[head_shake]
# Turn past amplitude_deg one way, then the other, within max_duration_s
enabled = true
amplitude_deg = 15.0
max_duration_s = 1.0
cooldown_s = 1.5
action = "toggle_pause"

[output]
cooldown_s = 1.0
dry_run = false

[output.actions]
# enter | space | left_click | wheel_down
next = "enter"

[feedback]
sound = true
# Print closures that didn't trigger (too short, too long, cooldown, paused)
log_blinks = true

[hotkeys]
# pynput syntax, e.g. "<ctrl>+<alt>+p", "<f8>". Empty string disables it.
pause = "<ctrl>+<alt>+p"
