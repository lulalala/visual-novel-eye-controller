# Copy to config.toml and pass with `vn-eye --config config.toml`.
# Every key is optional; the values below are the defaults.

[camera]
index = 0
width = 640
height = 480
fps = 30

[eyes]
# Openness is compared with a rolling median of your open-eye value.
baseline_window_s = 10.0
warmup_s = 2.0
# Closed below baseline * close_ratio, open again above baseline * open_ratio.
close_ratio = 0.55
open_ratio = 0.75
require_both_eyes = true

[blink]
enabled = true
# 0.15 lets natural blinks advance; 0.35-0.45 requires a deliberate closure
min_duration_s = 0.15
# Fires when you reopen your eyes; hold them shut past this to cancel
max_duration_s = 2.0
# Ignore blinks while the head is turned further than this
max_head_yaw_deg = 12.0
# Blinks within this long after the last one that fired are ignored
cooldown_s = 1.0

[head]
# Head turns are measured relative to a rolling median of your usual pose
baseline_window_s = 10.0

[head_shake]
# Turn past amplitude_deg one way, then the other, within max_duration_s
enabled = true
amplitude_deg = 15.0
max_duration_s = 1.0
cooldown_s = 1.5

[nod]
# Tilt past amplitude_deg and return within max_duration_s (like a real nod)
enabled = false
amplitude_deg = 12.0
max_duration_s = 0.8
cooldown_s = 1.0

[output]
dry_run = false

[output.actions]
# Keystroke/mouse outputs: enter | space | left_click | wheel_down | up | down
# App-level outputs: app:toggle_pause
blink = "enter"
head_shake = "app:toggle_pause"
nod_up = "up"
nod_down = "down"

[feedback]
sound = true
# Print gestures that didn't trigger (too short, too long, cooldown, paused)
log_rejected = true
