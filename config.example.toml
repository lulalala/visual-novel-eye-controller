# Copy to config.toml and pass with `vn-eye --config config.toml`.
# Every key except version is optional; the values below are the defaults.
version = 1

[camera]
index = 0
width = 640
height = 480
fps = 30

[eyes]
# vn-eye learns how open your eyes usually are over this many seconds
baseline_window_s = 10.0
# Seconds to learn before blinks can trigger
warmup_s = 2.0
# Lower close_ratio means you must close your eyes more fully to count
close_ratio = 0.55
open_ratio = 0.75
# Both eyes must close, so a wink doesn't count
require_both_eyes = true

[head]
# vn-eye learns your usual head position over this many seconds
baseline_window_s = 10.0

# Each gesture is a list of poses to hold in order:
#   eyes_closed, head_down, head_up, head_left, head_right
# A step can also be another gesture's name. Fields a gesture doesn't set
# use these defaults: any_order = false, past_deg = 15.0, release_deg = 10.0,
# hold_min_s = 0.0, hold_max_s = 0.0, within_s = 0.0 (0 = no limit),
# cooldown_s = 1.0, output = "" (send nothing).
# Outputs: enter, space, left_click, wheel_down, up, down, app:toggle_pause

[gestures.blink]
enabled = true
steps = ["eyes_closed"]
# 0.15 lets natural blinks advance; 0.35-0.45 requires a deliberate closure
hold_min_s = 0.15
# Fires when you reopen your eyes; hold them shut past this to cancel
hold_max_s = 2.0
cooldown_s = 1.0
output = "enter"

[gestures.head_shake]
# Turn past past_deg one way, then the other, back within release_deg, within within_s
enabled = true
steps = ["head_left", "head_right"]
any_order = true
past_deg = 15.0
release_deg = 10.0
within_s = 1.3
cooldown_s = 1.5
output = "app:toggle_pause"

[gestures.nod_up]
# Tilt past past_deg and back within release_deg, within hold_max_s
enabled = false
steps = ["head_up"]
past_deg = 12.0
release_deg = 8.0
hold_max_s = 0.8
cooldown_s = 1.0
output = "up"

[gestures.nod_down]
enabled = false
steps = ["head_down"]
past_deg = 12.0
release_deg = 8.0
hold_max_s = 0.8
cooldown_s = 1.0
output = "down"

# Add your own gesture under a new name. This one needs nod_down enabled;
# set nod_down's output = "" if it should only count as part of this one.
# [gestures.blink_then_nod]
# steps = ["blink", "nod_down"]
# within_s = 1.5
# output = "space"

[output]
dry_run = false

[feedback]
sound = true
# Print gestures that didn't trigger (too short, too long, cooldown, paused)
log_rejected = true
